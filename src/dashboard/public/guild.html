<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<title>Serveur — Fusion Bot</title>
<link rel="stylesheet" href="/style.css?v=volt1">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <a href="/dashboard" class="btn ghost sm" style="text-decoration:none">‹</a>
  <div class="ava" id="gico" style="width:38px;height:38px;font-size:17px">?</div>
  <div class="brand"><span id="gname">Chargement…</span><small id="gsub"></small></div>
  <div class="spacer"></div>
  <nav class="sidenav">
    <a href="/dashboard">Serveurs</a>
    <a href="/logout">Déconnexion</a>
  </nav>
</div></div>

<div class="wrap">
  <div id="view-home"></div>
  <div id="view-modules" hidden></div>
  <div id="view-commands" hidden></div>
</div>

<nav class="tabbar"><div class="tabbar-in">
  <button class="tab on" data-v="home"><span class="ic">📊</span>Accueil</button>
  <button class="tab" data-v="modules"><span class="ic">🧩</span>Modules</button>
  <button class="tab" data-v="commands"><span class="ic">⌨️</span>Commandes</button>
  <a class="tab" href="/dashboard"><span class="ic">🏠</span>Serveurs</a>
</div></nav>

<script src="/app.js?v=volt1"></script>
<script>
(async () => {
  const gid = location.pathname.split("/").filter(Boolean).pop();
  const $ = id => document.getElementById(id);
  const views = { home: $("view-home"), modules: $("view-modules"), commands: $("view-commands") };
  document.querySelectorAll(".tab[data-v]").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab[data-v]").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    Object.entries(views).forEach(([k, v]) => v.hidden = k !== t.dataset.v);
    window.scrollTo({ top: 0 });
  }));

  views.home.innerHTML = App.skeleton(3, 90);
  const g = await App.api(`/api/guild/${gid}`).catch(() => null);
  if (!g) { views.home.innerHTML = `<div class="empty"><div class="big">😴</div>Serveur introuvable ou bot absent.<br><a class="btn ghost sm mt" href="/dashboard">Retour</a></div>`; return; }

  document.title = g.name + " — Fusion Bot";
  $("gname").textContent = g.name;
  $("gsub").textContent = `${g.memberCount ?? "?"} membres · ${g.channelCount ?? "?"} salons`;
  const ic = App.iconUrl(g.id, g.icon);
  $("gico").innerHTML = ic ? `<img src="${ic}" alt="">` : App.esc(g.name.slice(0, 1).toUpperCase());

  // ---- Accueil ----
  views.home.innerHTML = `
    <div class="card"><div class="row">
      <div class="grow"><h2>Vue d'ensemble</h2><div class="sub">État du bot sur ce serveur</div></div>
      <span class="badge">EN LIGNE</span>
    </div>
    <div class="stats" style="margin:6px 0 0">
      <div class="stat"><b>${g.commandCount ?? "–"}</b><span>commandes</span></div>
      <div class="stat"><b>${g.modules.filter(m => m.enabled).length}/${g.modules.length}</b><span>modules actifs</span></div>
      <div class="stat"><b>${g.memberCount ?? "–"}</b><span>membres</span></div>
    </div></div>
    <div class="secttl">Modules</div>
    <div class="card" style="padding:8px 14px" id="modlist"></div>`;

  const modlist = document.getElementById("modlist");
  const paintMods = () => {
    modlist.innerHTML = g.modules.map(m => `
      <div class="item" data-m="${m.id}" style="cursor:default">
        <div class="ava">${m.emoji || "🧩"}</div>
        <div class="grow"><div class="t">${App.esc(m.name)}</div><div class="d">${App.esc(m.description || "")}</div></div>
        <span data-tgl="${m.id}"></span>
      </div>`).join("");
    g.modules.forEach(m => {
      const slot = modlist.querySelector(`[data-tgl="${m.id}"]`);
      slot.appendChild(App.toggle(m.enabled, async (v, revert) => {
        try { await App.api(`/api/guild/${gid}/modules/${m.id}/toggle`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: v }) }); m.enabled = v; App.toast(v ? "Module activé ✓" : "Module désactivé", "ok"); }
        catch (e) { revert(); App.toast("Échec : " + e.message, "err"); }
      }));
    });
  };
  paintMods();

  // ---- Modules (config détaillée) ----
  views.modules.innerHTML = `<div class="secttl" style="margin-top:4px">Configuration des modules</div>
    <div class="card" style="padding:8px 14px">` + g.modules.map(m => `
      <button class="item" data-cfg="${m.id}">
        <div class="ava">${m.emoji || "🧩"}</div>
        <div class="grow"><div class="t">${App.esc(m.name)}</div><div class="d">${m.enabled ? "Activé" : "Désactivé"} · toucher pour configurer</div></div>
        <span class="chev">›</span>
      </button>`).join("") + `</div>`;

  views.modules.querySelectorAll("[data-cfg]").forEach(b => b.addEventListener("click", () => openModule(b.dataset.cfg)));

  async function openModule(mid) {
    const meta = g.modules.find(m => m.id === mid);
    const s = App.sheet(meta ? meta.name : mid, "Chargement…");
    s.body.innerHTML = App.skeleton(4, 58);
    let schema;
    try { schema = await App.api(`/api/guild/${gid}/modules/${mid}/schema`); }
    catch (e) { s.body.innerHTML = `<div class="empty"><div class="big">😴</div>${App.esc(e.message)}</div>`; return; }
    s.setTitle(schema.title || (meta ? meta.name : mid));
    s.body.querySelector("p");

    const bar = document.createElement("div");
    bar.className = "savebar";
    const vals = {};
    const fields = schema.fields || [];

    const save = (() => {
      let t = null;
      return () => {
        clearTimeout(t);
        bar.innerHTML = `<span class="spin"></span> Enregistrement…`;
        t = setTimeout(async () => {
          try {
            await App.api(`/api/guild/${gid}/modules/${mid}/config`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ values: vals }) });
            bar.innerHTML = `<span class="ok">✓ Sauvegardé</span>`;
          } catch (e) { bar.innerHTML = `<span style="color:var(--danger)">Échec : ${App.esc(e.message)}</span>`; }
        }, 500);
      };
    })();

    const wrap = document.createElement("div");
    fields.forEach(f => {
      if (f.type === "info") { const d = document.createElement("div"); d.className = "card"; d.style.background = "var(--bg2)"; d.innerHTML = `<div class="sub" style="margin:0">${App.esc(f.value)}</div>`; wrap.appendChild(d); return; }
      vals[f.key] = f.value;
      const fd = document.createElement("div");
      fd.className = "field";
      const lab = document.createElement("label");
      lab.textContent = f.label;
      fd.appendChild(lab);

      if (f.type === "boolean") {
        const r = document.createElement("div"); r.className = "row";
        const t = App.toggle(!!f.value, v => { vals[f.key] = v; save(); });
        const st = document.createElement("span"); st.className = "mut"; st.textContent = f.value ? "Activé" : "Désactivé";
        const orig = t.onclick;
        r.append(t, st); fd.appendChild(r);
        t.addEventListener("click", () => setTimeout(() => st.textContent = t.getAttribute("aria-checked") === "true" ? "Activé" : "Désactivé", 0), true);
      } else if (f.type === "channel" || f.type === "role") {
        const sel = document.createElement("select");
        sel.className = "in";
        const opts = f.type === "channel" ? g.channels : g.roles;
        sel.innerHTML = `<option value="">— Non défini —</option>` + opts.map(o => {
          if (f.type === "channel") {
            const icn = o.kind === "voice" ? "🔊" : o.kind === "category" ? "📁" : "#";
            return `<option value="${o.id}" ${String(f.value) === o.id ? "selected" : ""}>${icn} ${App.esc(o.name)}</option>`;
          }
          const dot = o.color ? `<span class="role-dot" style="background:#${o.color.toString(16).padStart(6, "0")}"></span>` : "";
          return `<option value="${o.id}" ${String(f.value) === o.id ? "selected" : ""}>${App.esc(o.name)}</option>`;
        }).join("");
        sel.addEventListener("change", () => { vals[f.key] = sel.value || null; save(); });
        fd.appendChild(sel);
      } else if (f.type === "number") {
        const inp = document.createElement("input");
        inp.className = "in"; inp.type = "number"; inp.value = f.value ?? "";
        inp.addEventListener("change", () => { vals[f.key] = inp.value === "" ? null : Number(inp.value); save(); });
        fd.appendChild(inp);
      } else {
        const inp = document.createElement("input");
        inp.className = "in"; inp.type = "text"; inp.value = f.value ?? "";
        inp.placeholder = f.label;
        inp.addEventListener("change", () => { vals[f.key] = inp.value.trim() || null; save(); });
        fd.appendChild(inp);
      }
      if (f.hint) { const h = document.createElement("div"); h.className = "hint"; h.textContent = f.hint; fd.appendChild(h); }
      wrap.appendChild(fd);
    });
    if (!fields.length) wrap.innerHTML = `<div class="empty"><div class="big">🧩</div>Aucun réglage pour ce module.</div>`;
    s.body.innerHTML = "";
    s.body.append(wrap, bar);
  }

  // ---- Commandes ----
  views.commands.innerHTML = `
    <div class="search"><input class="in" id="cq" type="search" placeholder="Rechercher une commande…" autocomplete="off"></div>
    <div id="pills" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"></div>
    <div id="cmds">${App.skeleton(5, 58)}</div>`;
  const cmds = await App.api(`/api/guild/${gid}/commands`).catch(() => []);
  const mods = [...new Set(cmds.map(c => c.moduleId))].sort();
  let fmod = "";
  const pills = document.getElementById("pills");
  const paintPills = () => {
    pills.innerHTML = `<button class="pill ${!fmod ? "on" : ""}" data-m="">Toutes</button>` +
      mods.map(m => `<button class="pill ${fmod === m ? "on" : ""}" data-m="${App.esc(m)}">${App.esc(m)}</button>`).join("");
    pills.querySelectorAll(".pill").forEach(p => p.addEventListener("click", () => { fmod = p.dataset.m; paintPills(); paintCmds(document.getElementById("cq").value); }));
  };
  const paintCmds = (q) => {
    const list = cmds.filter(c =>
      (!fmod || c.moduleId === fmod) &&
      (!q || (c.name + " " + c.description).toLowerCase().includes(q.toLowerCase())));
    document.getElementById("cmds").innerHTML = list.length
      ? `<div class="card" style="padding:8px 14px">` + list.map(c => `
        <div class="item" style="cursor:default">
          <div class="grow"><div class="cmdname">/${App.esc(c.name)}</div><div class="d">${App.esc(c.description || "")}</div></div>
          <span class="badge off">${App.esc(c.moduleId)}</span>
        </div>`).join("") + `</div>
        <p class="ctr mut">${list.length} commande${list.length > 1 ? "s" : ""}</p>`
      : `<div class="empty"><div class="big">🔍</div>Aucune commande trouvée.</div>`;
  };
  paintPills(); paintCmds("");
  document.getElementById("cq").addEventListener("input", e => paintCmds(e.target.value));
})();
</script>
</body>
</html>
