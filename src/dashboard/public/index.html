<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e1f22">
  <title>Fusion — Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">⚡</span> Fusion</a>
    <div>
      <a id="login-btn" class="btn btn-primary btn-sm" href="/login" style="display:none;">Se connecter</a>
      <div id="user-chip" class="user-chip" style="display:none;"></div>
    </div>
  </header>

  <main class="hero">
    <div class="logo-big">⚡</div>
    <h1>Fusion Bot</h1>
    <p>Un seul bot pour tout ton serveur : sécurité, musique, tickets, économie, salons vocaux, backups et communauté. Configure tout ici, ou directement sur Discord.</p>
    <div>
      <a class="btn btn-primary" href="/login" style="font-size:1rem;padding:13px 28px;">🔗 Se connecter avec Discord</a>
    </div>
    <div class="stats" id="hero-stats" style="max-width:520px;margin:32px auto 0;"></div>
  </main>

  <div class="feat-grid" id="features"></div>
  <div id="toasts"></div>

  <script src="/app.js"></script>
  <script>
    const MODULES = [
      { e: "🛡️", n: "Sécurité", d: "Anti-nuke, vérification captcha, whitelist." },
      { e: "⛨", n: "Protection", d: "Anti-raid, anti-spam et logs détaillés." },
      { e: "🎵", n: "Musique", d: "File d'attente, vote-skip, playlists." },
      { e: "🎫", n: "Tickets", d: "Panels, claim, priorités, transcripts." },
      { e: "💰", n: "Économie", d: "Monnaie, boutique, slots, blackjack." },
      { e: "🧰", n: "Utilitaires", d: "Infos, outils pratiques, mini-jeux." },
      { e: "🔊", n: "Salons vocaux", d: "Salons temporaires automatiques." },
      { e: "💾", n: "Backups", d: "Sauvegarde et restauration du serveur." },
      { e: "🐸", n: "Froggy", d: "Piège à bots spam." },
      { e: "🎉", n: "Communauté", d: "Giveaways, niveaux, invitations." },
    ];
    document.getElementById("features").innerHTML = MODULES.map(m =>
      `<div class="feat"><div class="fe">${m.e}</div><h3>${m.n}</h3><p>${m.d}</p></div>`
    ).join("");

    (async () => {
      const err = new URLSearchParams(location.search).get("error");
      if (err) toast("Connexion Discord refusée : " + err, "error");
      try {
        const s = await api("/api/stats");
        document.getElementById("hero-stats").innerHTML =
          `<div class="stat"><div class="num">${s.guilds}</div><div class="lbl">🖥️ Serveurs</div></div>` +
          `<div class="stat"><div class="num">${s.commands}</div><div class="lbl">⌨️ Commandes</div></div>` +
          `<div class="stat"><div class="num">${s.members}</div><div class="lbl">👥 Membres</div></div>` +
          `<div class="stat"><div class="num">${s.modules}</div><div class="lbl">🧩 Modules</div></div>`;
      } catch (e) { /* stats indisponibles */ }
      const me = await loadUserChip();
      if (me) window.location.href = "/dashboard";
    })();
  </script>
</body>
</html>
