<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<title>Mes serveurs — Fusion Bot</title>
<link rel="stylesheet" href="/style.css?v=volt1">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="logo">⚡</div>
  <div class="brand">Fusion Bot<small>Mes serveurs</small></div>
  <div class="spacer"></div>
  <nav class="sidenav">
    <a href="/dashboard" class="on">Serveurs</a>
    <a href="/logout">Déconnexion</a>
  </nav>
</div></div>

<div class="wrap">
  <div class="search"><input class="in" id="q" type="search" placeholder="Rechercher un serveur…" autocomplete="off"></div>
  <div id="list"></div>
</div>

<nav class="tabbar"><div class="tabbar-in">
  <a class="tab on" href="/dashboard"><span class="ic">🏠</span>Serveurs</a>
  <button class="tab" id="tab-user"><span class="ic">👤</span><span id="uname">Moi</span></button>
  <a class="tab" href="/logout"><span class="ic">🚪</span>Quitter</a>
  <a class="tab" href="/"><span class="ic">⚡</span>Accueil</a>
</div></nav>

<script src="/app.js?v=volt1"></script>
<script>
(async () => {
  const list = document.getElementById("list");
  list.innerHTML = App.skeleton(4, 74);
  const [me, guilds] = await Promise.all([
    App.api("/api/me").catch(() => null),
    App.api("/api/guilds").catch(() => null),
  ]);
  if (!guilds) { list.innerHTML = `<div class="empty"><div class="big">😴</div>Impossible de charger tes serveurs.<br><button class="btn ghost sm mt" onclick="location.reload()">Réessayer</button></div>`; return; }
  if (me) document.getElementById("uname").textContent = me.username.split("#")[0].slice(0, 10);
  document.getElementById("tab-user").onclick = () => App.toast("Connecté en tant que " + (me ? me.username : "?"));

  const render = (f) => {
    const g = guilds.filter(x => x.name.toLowerCase().includes(f.toLowerCase()));
    if (!g.length) { list.innerHTML = `<div class="empty"><div class="big">🔍</div>Aucun serveur trouvé.</div>`; return; }
    list.innerHTML = `<div class="card" style="padding:8px 14px">` + g.map(x => {
      const ic = App.iconUrl(x.id, x.icon);
      return `<a class="item" href="/dashboard/${x.id}">
        <div class="ava">${ic ? `<img src="${ic}" alt="">` : App.esc(x.name.slice(0, 1).toUpperCase())}</div>
        <div class="grow"><div class="t">${App.esc(x.name)}</div><div class="d">Configurer ce serveur</div></div>
        <span class="badge">EN LIGNE</span><span class="chev">›</span>
      </a>`;
    }).join("") + `</div>`;
  };
  document.getElementById("q").addEventListener("input", e => render(e.target.value));
  render("");
})();
</script>
</body>
</html>
